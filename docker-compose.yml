volumes:
  pgData:

services:
  # 健身房前端（成品，不要改它 — 它是你的驗收機）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://127.0.0.1:8080/api/
    ports:
      - "3000:80"

  # API 文件（Swagger UI，瀏覽 + Try it out 試打你的後端）
  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      - SWAGGER_JSON=/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro
    ports:
      - "8081:8080"

  # PostgreSQL（空的資料庫，等你的後端來建表）
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      - POSTGRES_USER=student
      - POSTGRES_PASSWORD=student666
      - POSTGRES_DB=fitness
    volumes:
      - pgData:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d fitness"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # W10 容器化挑戰：把你的後端加進來
  # 規則（GitHub Actions 的壓軸驗收按這個來）：
  #   - 服務名稱必須叫 backend
  #   - 對外要開 8080（"8080:你的PORT"）
  # 提示：
  #   - build 你自己寫的 Dockerfile
  #   - 容器裡連資料庫，DB_HOST 不再是 localhost（想想容器之間怎麼互相稱呼）
  #   - 要有 healthcheck（打你的 GET /healthcheck）
  #   - depends_on postgres 的 healthy
  # ============================================================
  # backend:
  #   build: ...
