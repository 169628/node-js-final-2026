<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 18 10 L 0 19 z" fill="#111827"/>
    </marker>
    <style>
      text {
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", Arial, sans-serif;
        fill: #111827;
        letter-spacing: 0;
      }
      .title { font-size: 58px; font-weight: 800; }
      .frame-label { font-size: 54px; font-weight: 800; }
      .region-label { font-size: 54px; font-weight: 800; fill: #2563eb; }
      .box-label { font-size: 45px; font-weight: 800; }
      .backend-label { font-size: 48px; font-weight: 850; }
      .small { font-size: 31px; font-weight: 800; }
      .arrow-label { font-size: 31px; font-weight: 750; }
      .arrow { fill: none; stroke: #111827; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="960" y="82" text-anchor="middle" class="title">最終作業：壓軸容器化後（docker compose up 一鍵全包）</text>

  <rect x="80" y="126" width="1760" height="890" rx="30" fill="#fafafa" stroke="#8a8a8a" stroke-width="5"/>
  <text x="960" y="207" text-anchor="middle" class="frame-label">你的電腦</text>

  <rect x="240" y="245" width="1440" height="118" rx="16" fill="#ffffff" stroke="#15803d" stroke-width="5"/>
  <text x="960" y="323" text-anchor="middle" class="frame-label">瀏覽器</text>

  <rect x="150" y="440" width="1610" height="520" rx="25" fill="#eaf5ff" stroke="#2563eb" stroke-width="5"/>
  <text x="195" y="515" class="region-label">Docker</text>

  <rect x="215" y="555" width="700" height="105" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <text x="565" y="622" text-anchor="middle" class="box-label">前端 :3000</text>

  <rect x="215" y="695" width="700" height="105" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <text x="565" y="762" text-anchor="middle" class="box-label">Swagger 文件 :8081</text>

  <rect x="215" y="835" width="700" height="105" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <text x="565" y="902" text-anchor="middle" class="box-label">PostgreSQL :5432</text>

  <rect x="1190" y="610" width="500" height="190" rx="20" fill="#ffffff" stroke="#dc2626" stroke-width="7"/>
  <text x="1440" y="695" text-anchor="middle" class="backend-label">backend 容器 :8080</text>
  <text x="1440" y="753" text-anchor="middle" class="small">你的 Dockerfile + healthcheck</text>

  <path d="M 725 363 L 580 555" class="arrow"/>
  <rect x="415" y="412" width="150" height="48" rx="8" fill="#ffffff" opacity="0.95"/>
  <text x="490" y="447" text-anchor="middle" class="arrow-label">看網站</text>

  <path d="M 1260 363 L 1435 610" class="arrow"/>
  <rect x="1135" y="444" width="360" height="52" rx="8" fill="#ffffff" opacity="0.95"/>
  <text x="1315" y="481" text-anchor="middle" class="arrow-label">照樣打 localhost:8080</text>

  <path d="M 1190 745 L 1040 745 L 1040 888 L 915 888" class="arrow"/>
  <rect x="930" y="812" width="720" height="50" rx="8" fill="#ffffff" opacity="0.95"/>
  <text x="1290" y="849" text-anchor="middle" class="arrow-label">DB_HOST=postgres ← 不再是 localhost！服務名稱</text>
</svg>
